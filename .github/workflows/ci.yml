name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.3
      - name: fmt
        run: terraform fmt -check -recursive
      - name: validate
        run: |
          for d in bootstrap envs/dev; do
            (cd "$d" && terraform init -backend=false -input=false && terraform validate)
          done
      - name: module tests (AWS provider mocked)
        run: |
          for m in network bastion app; do
            (cd "modules/$m" && terraform init -backend=false -input=false && terraform test)
          done
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: security scan (checkov)
        run: |
          pip install checkov
          checkov -d . --quiet --compact
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
      - name: tflint
        run: |
          tflint --init
          tflint --recursive
